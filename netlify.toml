[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  # Skip the build entirely (0 minutes consumed) when nothing under frontend/
  # or this config file changed since the last successful deploy — pushes
  # touching only mobile_app/, supabase/, docs/, etc. no longer trigger a
  # rebuild. git diff --quiet exits 0 (= "nothing changed" = skip) when the
  # path is untouched, non-zero (= proceed) when it is.
  # The command runs from the base directory (frontend/), so paths are relative
  # to it: "." is frontend/ itself and "../netlify.toml" is this file. Writing
  # "frontend/" here matches nothing from inside frontend/, so git sees "no
  # changes" and every build is skipped, even commits that touch the frontend.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "18"

# Build assets are content-hashed and change on every deploy. A tab left open
# from before a deploy can request a chunk that no longer exists; without this
# rule the catch-all below would answer with index.html at 200, and the
# browser's dynamic import() would fail on a JS-vs-HTML MIME mismatch instead
# of rejecting cleanly. This must come before the catch-all so it wins first.
[[redirects]]
  from = "/assets/*"
  to = "/index.html"
  status = 404

# The old language addresses (/?lang=it) now live at /it and /ro. "/" exists as a
# real file, so force is needed for the rule to win over it.
[[redirects]]
  from = "/"
  query = {lang = "it"}
  to = "/it"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = {lang = "ro"}
  to = "/ro"
  status = 301
  force = true

# The pricing page was merged into the landing
[[redirects]]
  from = "/pricing"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Private areas: kept out of search results. This is done with a header rather
# than robots.txt, because a page blocked in robots.txt can't be crawled and so
# Google never gets to see that it should be dropped.
[[headers]]
  for = "/card/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/card"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/wallet"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/recovery"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/select-tenant"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/super-admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
